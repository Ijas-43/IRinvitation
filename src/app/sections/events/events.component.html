<section #section id="events" class="section events" aria-labelledby="events-title">
  <div class="events__bg" aria-hidden="true">
    <span class="events__blossom" data-parallax="-70" data-parallax-rotate="18">❀</span>
  </div>

  <div class="container">
    <header class="section-head">
      <p class="section-kicker" data-reveal>{{ cfg.eyebrow }}</p>
      <h2 id="events-title">
        <span class="split-line" data-split>{{ cfg.title }}</span>
        <span class="split-line" data-split><i>{{ cfg.titleEm }}</i></span>
      </h2>
      <p class="section-lead" data-reveal>{{ cfg.lead }}</p>
    </header>

    <ol class="timeline" data-reveal-group>
      <li
        *ngFor="let ev of cfg.items; let i = index; trackBy: trackById"
        class="timeline__item"
        [class.timeline__item--alt]="i % 2 === 1"
        data-reveal
      >
        <!-- Glowing Event Marker -->
        <div class="timeline__marker" aria-hidden="true">
          <span class="marker__glow"></span>
          <span class="timeline__node">{{ ev.index }}</span>
        </div>

        <article class="timeline__card glass-card glass-card--rose" [appTilt]="4">
          <header class="timeline__head">
            <p class="timeline__time">
              <span aria-hidden="true">⏰</span> {{ ev.timeLabel }}
            </p>
            <span class="timeline__badge">Saturday, 26 Dec</span>
          </header>

          <h3 class="timeline__title">{{ ev.title }}</h3>
          <p class="timeline__desc">{{ ev.description }}</p>

          <p class="timeline__venue">
            <span aria-hidden="true">📍</span>
            <span>
              <strong>{{ ev.venue }}</strong>
            </span>
          </p>

          <div class="timeline__actions">
            <a
              class="button ghost timeline__btn"
              [href]="ev.mapUrl"
              target="_blank"
              rel="noopener noreferrer"
            >
              Get Directions
            </a>
            <a
              class="button outline timeline__btn"
              [href]="calendarUrl(ev)"
              target="_blank"
              rel="noopener noreferrer"
            >
              Calendar +
            </a>
          </div>
        </article>
      </li>
    </ol>
  </div>
</section>
